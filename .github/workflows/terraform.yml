name: Terraform Deployment Workflow

on:
  push:
    branches:
      - develop

permissions:
  id-token: write
  contents: read

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      - name: Login to Azure using OIDC
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set Terraform Azure credentials
        run: |
          echo "ARM_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}" >> $GITHUB_ENV
          echo "ARM_CLIENT_SECRET=${{ secrets.AZURE_CLIENT_SECRET }}" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}" >> $GITHUB_ENV
          echo "ARM_SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID }}" >> $GITHUB_ENV

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        id: terraform-plan
        run: terraform plan --var-file=dev_terraform.tfvars -out tf.plan -lock=false

      

      # Convert Terraform Plan to JSON
      - name: Convert Plan to JSON
        run: terraform show -no-color tf.plan > tfplan.txt

      - name: Check for Changes and Notify
        id: check-changes
        run: |
          grep -E '^\s*[~+-]' tfplan.txt || echo "No changes detected in the plan"
          changes=$(grep -E '^\s*[~+-]' tfplan.txt | wc -l)
          echo "Changes detected: $changes"
          echo "CHANGES=$changes" >> $GITHUB_ENV

          if [ "$changes" -gt 0 ]; then
            echo "Changes detected in the Terraform plan. Sending email notification..."
            echo "Terraform plan contains changes: $changes changes detected." | mail -s "Terraform Plan Changes Detected" -r ${{ secrets.SMTP_USERNAME }} --smtp-server ${{ secrets.SMTP_SERVER }} --smtp-username ${{ secrets.SMTP_USERNAME }} --smtp-password ${{ secrets.SMTP_PASSWORD }} ${{ secrets.RECIPIENT_EMAIL }}
          else
            echo "No changes detected in the Terraform plan."
          fi
        env:
          SMTP_SERVER: smtp.gmail.com
          SMTP_PORT: 587
          SMTP_USERNAME: ${{secrets.SMTP_USERNAME}}
          SMTP_PASSWORD: ${{secrets.SMTP_PASSWORD}}
          RECIPIENT_EMAIL: ${{secrets.RECIPIENT_EMAIL}}