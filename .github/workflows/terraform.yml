name: Terraform Deployment Workflow

on:
  push:
    branches:
      - develop

permissions:
  id-token: write
  contents: read

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      - name: Login to Azure using OIDC
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set Terraform Azure credentials
        run: |
          echo "ARM_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}" >> $GITHUB_ENV
          echo "ARM_CLIENT_SECRET=${{ secrets.AZURE_CLIENT_SECRET }}" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}" >> $GITHUB_ENV
          echo "ARM_SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID }}" >> $GITHUB_ENV

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        id: terraform-plan
        run: terraform plan --var-file=dev_terraform.tfvars -out tf.plan -lock=false

      

      # Convert Terraform Plan to JSON
      - name: Convert Plan to JSON
        run: terraform show -no-color tf.plan > tfplan.txt

      # Parse Plan JSON for Changes
      - name: Check for Changes
        id: check_changes
        run: |
          changes=$(jq '[.resource_changes[] | select(.change.actions | contains(["create", "update", "delete"]))]' plan.json)
          echo "$changes" > changes.json
          if [ -s changes.json ]; then
            echo "CHANGES_DETECTED=true" >> $GITHUB_ENV
          else
            echo "CHANGES_DETECTED=false" >> $GITHUB_ENV
          fi
        env:
          GITHUB_ENV: ${{ env.GITHUB_ENV }}

      # Send Email if Changes Detected
      - name: Send Email Notification
        if: env.CHANGES_DETECTED == 'true'
        run: |
          echo "Changes detected in the Terraform plan, sending email."
          cat changes.json | jq '.' > formatted_changes.txt

          # Configure msmtp for SMTP email
          echo "account default" > ~/.msmtprc
          echo "host smtp.gmail.com" >> ~/.msmtprc
          echo "port 587" >> ~/.msmtprc
          echo "from your-email@gmail.com" >> ~/.msmtprc
          echo "user your-email@gmail.com" >> ~/.msmtprc
          echo "password ${{ secrets.SMTP_PASSWORD }}" >> ~/.msmtprc
          echo "tls on" >> ~/.msmtprc
          echo "tls_starttls on" >> ~/.msmtprc
          echo "auth on" >> ~/.msmtprc
          echo "logfile ~/.msmtp.log" >> ~/.msmtprc

          # Send the email using msmtp
          echo -e "Subject: Terraform Plan Changes Detected\n\nThe following changes were detected:\n\n$(cat formatted_changes.txt)" | msmtp recipient@example.com
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}