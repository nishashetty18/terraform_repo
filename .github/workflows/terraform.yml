name: Terraform Deployment Workflow

on:
  push:
    branches:
      - develop

permissions:
  id-token: write
  contents: read

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.9.6

      - name: Login to Azure using OIDC
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set Terraform Azure credentials
        run: |
          echo "ARM_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}" >> $GITHUB_ENV
          echo "ARM_CLIENT_SECRET=${{ secrets.AZURE_CLIENT_SECRET }}" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}" >> $GITHUB_ENV
          echo "ARM_SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID }}" >> $GITHUB_ENV

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        id: terraform-plan
        run: |
          terraform plan --var-file=dev_terraform.tfvars -lock=false -out tfplan.out
          terraform show tfplan.out
          terraform show tfplan.out > readable_plan.txt
          
          

      - name: Check for Changes
        id: check-changes
        run: |
          changes=$(grep -E '^\s*[~+-]' plan.json | wc -l)
          echo "Changes detected: $changes"
          # Set an output for the next job to use
          if [ "$changes" -gt 0 ]; then
            echo "changes=true" >> $GITHUB_ENV
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_ENV
            echo "changes=false" >> $GITHUB_OUTPUT
          fi
      - name: Print changes output for debugging
        run: |
          python changes.py
          cat changes_summary.txt
          
      - name: Check Plan for Changes
        id: check-plan
        run: |
          if grep -q "Plan: 0 to add, 0 to change, 0 to destroy" readable_plan.txt; then
            echo "No changes detected."
            echo "SEND_MAIL=false" >> $GITHUB_ENV
          else
            echo "Changes detected."
            echo "SEND_MAIL=true" >> $GITHUB_ENV
          fi

      - name: Read Plan File
        id: read-plan
        run: |
          body=$(cat changes_summary.txt)
          echo "EMAIL_BODY<<EOF" >> $GITHUB_ENV
          echo "$body" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # Step 1: Install swaks
      - name: Install swaks
        run: sudo apt-get update && sudo apt-get install -y swaks

      # Only send email if there are changes in the Terraform plan
      - name: Send email notification with plan changes
        if: env.SEND_MAIL == 'true'
        run: |
          swaks \
          --to ${{ secrets.SMTP_USERNAME }} \
          --from ${{ secrets.default_username }}@sandbox.mailtarget.co \
          --auth \
          --auth-user=${{ secrets.auth_user_smtp}} \
          --auth-password=${{ secrets.auth_password_smtp}} \
          --server smtp-sandbox.mtrgt.net:587 \
          --tls \
          --h-Subject="Terraform Plan" \
          --h-From="${{ secrets.default_username }}@sandbox.mailtarget.co" \
          --h-To="${{ secrets.SMTP_USERNAME }}" \
          --body "$EMAIL_BODY"
        # uses: dawidd6/action-send-mail@v2
