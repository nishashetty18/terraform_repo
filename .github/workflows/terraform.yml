name: Terraform Deployment Workflow

on:
  push:
    branches:
      - develop

permissions:
  id-token: write
  contents: read

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      - name: Login to Azure using Managed Identity
        uses: azure/login@v1
        with:
          auth-type: 'IDENTITY'
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        id: terraform-plan
        run: terraform plan --var-file=develop_terraform.tfvars -out=tfplan

      - name: Check for Changes
        id: check-changes
        run: |
          terraform show -json tfplan > plan.json
          changes=$(jq '.resource_changes | length' plan.json)
          echo "CHANGES_DETECTED=$changes" >> $GITHUB_ENV

      