name: Terraform Deployment Workflow

on:
  push:
    branches:
      - develop

permissions:
  id-token: write
  contents: read

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      - name: Login to Azure using OIDC
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set Terraform Azure credentials
        run: |
          echo "ARM_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}" >> $GITHUB_ENV
          echo "ARM_CLIENT_SECRET=${{ secrets.AZURE_CLIENT_SECRET }}" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}" >> $GITHUB_ENV
          echo "ARM_SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID }}" >> $GITHUB_ENV

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        id: terraform-plan
        run: terraform plan --var-file=dev_terraform.tfvars -out=tfplan

      - name: Debug Plan File
        run: |
          if [ -f tfplan ]; then
            echo "tfplan exists and is:"
            file tfplan
          else
            echo "tfplan file is missing."
            exit 1
          fi

      - name: Check for Changes
        run: |
          terraform show -json tfplan > plan.json || { echo "Failed to generate plan.json"; exit 1; }
          if [ ! -s plan.json ]; then
            echo "Generated plan.json is empty or invalid."
            exit 1
          fi
          changes=$(jq '.resource_changes | length' plan.json)
          echo "CHANGES_DETECTED=$changes" >> $GITHUB_ENV
          if [ "$changes" -gt 0 ]; then
            echo "Changes detected in the Terraform plan: $changes resources modified."
            exit 1
          else
            echo "No changes detected in the Terraform plan."
          fi
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}